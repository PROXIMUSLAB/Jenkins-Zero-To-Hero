name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request: 
    branches: ["main"]
  workflow_dispatch: #
    

jobs:
  build-analyze-deploy:
    runs-on: self-hosted # Targets your self-hosted runner VM

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 & Maven
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and Test (Maven)
        run: |
          cd java-maven-sonar-argocd-helm-k8s/spring-boot-app
          mvn clean package

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          cd java-maven-sonar-argocd-helm-k8s/spring-boot-app
          mvn sonar:sonar \
            -Dsonar.token="${{ secrets.SONAR_TOKEN }}" \
            -Dsonar.host.url="${{ vars.SONAR_HOST_URL }}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        env:
          DOCKER_IMAGE: ankittomar0207/ultimate-cicd:${{ github.run_number }}
        run: |
          cd java-maven-sonar-argocd-helm-k8s/spring-boot-app
          docker build -t ${{ env.DOCKER_IMAGE }} .
          docker push ${{ env.DOCKER_IMAGE }}

      - name: Update Deployment Manifest File
        run: |
          git config user.email "ankittomar0207@gmail.com"
          git config user.name "Ankit Tomar"
          
          # Update the image tag in deployment.yml using the GitHub run number
          BUILD_NUMBER=${{ github.run_number }}
          sed -i "s/replaceImageTag/${BUILD_NUMBER}/g" java-maven-sonar-argocd-helm-k8s/spring-boot-app-manifests/deployment.yml
          
          git add java-maven-sonar-argocd-helm-k8s/spring-boot-app-manifests/deployment.yml
          git commit -m "Update deployment image to version ${BUILD_NUMBER}"
          
          # Push back using the GitHub PAT stored in a secret
          git push https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git HEAD:main
