name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request: 
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-analyze-deploy:
    runs-on: self-hosted

    env:
      JAVA_HOME: /opt/java/jdk-17
      PATH: /opt/java/jdk-17/bin:/opt/maven/current/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Test (Maven)
        run: |
          cd java-maven-sonar-argocd-helm-k8s/spring-boot-app
          mvn clean package

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_GITHUB }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          cd java-maven-sonar-argocd-helm-k8s/spring-boot-app
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.token="${{ secrets.SONAR_TOKEN_GITHUB }}" \
            -Dsonar.host.url="${{ vars.SONAR_HOST_URL }}"

      - name: Trivy Scan Java JAR
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'java-maven-sonar-argocd-helm-k8s/spring-boot-app/target/spring-boot-web.jar'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload JAR to Nexus
        env:
          NEXUS_URL: ${{ vars.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          cd java-maven-sonar-argocd-helm-k8s/spring-boot-app

          echo "Checking Nexus connectivity..."

          echo "Nexus URL being used: ${NEXUS_URL}"

          curl -sS -o /dev/null -w "HTTP Status: %{http_code}\n" \ 
           "${NEXUS_URL}"
                                                                    

          # Configure Nexus credentials for Maven
          mkdir -p ~/.m2

          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>nexus</id>
                <username>${NEXUS_USERNAME}</username>
                <password>${NEXUS_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

          # Upload the already-built JAR
          mvn org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file \
            -Dfile=target/spring-boot-web.jar \
            -DpomFile=pom.xml \
            -DrepositoryId=nexus \
            -Durl="${NEXUS_URL}"


  docker-and-deploy:
    runs-on: ubuntu-latest
    needs: build-analyze-deploy # Corrected to match the exact first job name

    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: java-maven-sonar-argocd-helm-k8s/spring-boot-app
          file: java-maven-sonar-argocd-helm-k8s/spring-boot-app/Dockerfile
          push: true
          tags: ankittomar0207/ultimate-cicd:${{ github.run_number }}

      - name: Update Deployment Manifest File
        run: |
          git config user.email "ankittomar0207@gmail.com"
          git config user.name "Ankit Tomar"
          
          BUILD_NUMBER=${{ github.run_number }}
          sed -i "s/replaceImageTag/${BUILD_NUMBER}/g" java-maven-sonar-argocd-helm-k8s/spring-boot-app-manifests/deployment.yml
          
          git add java-maven-sonar-argocd-helm-k8s/spring-boot-app-manifests/deployment.yml
          git commit -m "Update deployment image to version ${BUILD_NUMBER}"
          
          
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
